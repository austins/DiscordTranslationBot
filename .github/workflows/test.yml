name: Test

on: [ workflow_call, workflow_dispatch ]

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up .NET Core SDK
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: '11.x'
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', 'global.json') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget-
            -   name: Restore dependencies
                run: dotnet restore
            -   name: Test
                run: dotnet test --no-restore -c Release --results-directory ./test-results -- --report-xunit-ctrf
            -   if: always()
                name: Publish test report
                uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
                with:
                    report-path: ./test-results/*.ctrf
                    summary-report: true
                    file-report: true
                    failed-folded-report: true
                    skipped-report: true
